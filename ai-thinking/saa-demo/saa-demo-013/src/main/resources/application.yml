spring:
  ai:
    dashscope:
      # 1. API Key 只从环境变量读取，避免把敏感凭证写进课程代码。
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          # 2. 第 13 讲固定模型锚点，真实启动时用于观察 ParallelAgent 链路。
          model: qwen-max
  application:
    # 3. 第 13 讲演示 ParallelAgent 并发评审。
    name: saa-demo-013
management:
  endpoints:
    web:
      exposure:
        # 4. 开启最小观测端点，方便验证应用是否启动。
        include: health,info,metrics
server:
  # 5. demo 模块使用独立端口，避免和历史 lesson 模块冲突。
  port: 9513
