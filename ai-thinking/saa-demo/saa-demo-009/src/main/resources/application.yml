spring:
  ai:
    dashscope:
      # 1. API Key 只从环境变量读取，避免把敏感凭证写进课程代码。
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          # 2. 第 9 讲固定模型锚点，方便观察 Skills 调用链路。
          model: qwen-max
management:
  endpoints:
    web:
      exposure:
        # 3. 开启最小观测端点，方便验证应用是否启动。
        include: health,info,metrics
server:
  # 4. demo 模块使用独立端口，避免和历史 lesson 模块冲突。
  port: 9509
