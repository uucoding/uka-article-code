spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
  ai:
    openai:
      # 网关地址：由于各种原因，我们选择使用中转站的方式来体验OpenAI的API
      base-url: https://api.openai-hk.com
      # 密钥认证：使用变量
      api-key: ${OPEN_AI_API_KEY}
      chat:
        # 指定调用的模型名称 deepseek-r1
        options:
          model: deepseek-r1
      embedding:
        options:
          model: text-embedding-3-small
#   设置使用的是内存存储
    vectorstore:
#     不删除VectorStoreConfig配置的情况，这里需要指定redis，否则会出现多个相同的VectorStore Bean导致注入冲突，或者直接删除VectorStoreConfig的配置
      type: simple
      redis:
        # 索引名称，自动帮你建好，默认是：default-index
        index-name: spring-ai-document-index
        # Redis Key 的前缀
        prefix: "document:"
        # 开启自动建表与初始化索引
        initialize-schema: true