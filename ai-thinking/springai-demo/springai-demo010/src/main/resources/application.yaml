spring:
  ai:
    openai:
      # 网关地址：由于各种原因，我们选择使用中转站的方式来体验OpenAI的API
      base-url: https://api.openai-hk.com
      # 密钥认证：使用变量
      api-key: ${OPEN_AI_API_KEY}
      chat:
        # 指定调用的模型名称 deepseek-r1
        options:
          model: deepseek-r1
      embedding:
        options:
          model: text-embedding-3-small